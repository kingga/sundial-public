<style>:root { --ground: #f4f0e8; --ink: #1c1a17; --muted: #655e53; --line: #ddd5c8; --accent: #a34b16; }
@media (prefers-color-scheme: dark) {
  :root { --ground: #141311; --ink: #f2ede4; --muted: #a9a194; --line: #36322d; --accent: #f0a04b; }
}
body { margin: 0; background: var(--ground); color: var(--ink);
  font: 1.0625rem/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
main, footer { max-width: 40rem; margin: 0 auto; padding: 2.5rem 1.25rem; }
footer { padding-top: 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.9375rem; }
h1, h2, h3 { line-height: 1.25; }
h1 { font-size: 2rem; margin: 0 0 1rem; }
h2 { font-size: 1.375rem; margin: 2.25rem 0 0.5rem; }
h3 { font-size: 1.0625rem; margin: 1.75rem 0 0.25rem; }
a { color: var(--accent); text-underline-offset: 0.15em; }
a[aria-current] { color: inherit; text-decoration: none; font-weight: 600; }
li + li { margin-top: 0.25rem; }
